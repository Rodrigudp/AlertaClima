name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend - testes e cobertura
    runs-on: ubuntu-latest
    # MongoDB real para os testes de repositório (@DataMongoTest). No CI ele substitui o
    # MongoDB embarcado (Flapdoodle), que não tem binário para todas as versões do Ubuntu do runner.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes + verificação de cobertura (JaCoCo >= 70%)
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/alertaclima_test
          SPRING_AUTOCONFIGURE_EXCLUDE: de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
        run: mvn -B verify

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {
              printf "### Cobertura JaCoCo\n\n| Métrica | Cobertura |\n|---|---|\n| Linhas | %.1f%% (%d/%d) |\n| Branches | %.1f%% (%d/%d) |\n", 100*lc/(lc+lm), lc, lc+lm, 100*bc/(bc+bm), bc, bc+bm
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
            awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7; im+=$4; ic+=$5} END {
              printf "::notice title=Cobertura JaCoCo::Linhas %.1f%% (%d/%d) | Instrucoes %.1f%% | Branches %.1f%%\n", 100*lc/(lc+lm), lc, lc+lm, 100*ic/(ic+im), 100*bc/(bc+bm)
            }' target/site/jacoco/jacoco.csv
          fi

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-jacoco
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
