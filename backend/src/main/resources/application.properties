
spring.data.mongodb.uri=mongodb://localhost:27017/alertaclima
server.port=8080
app.base-url=http://localhost:${server.port}

springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# Cria os índices declarados com @Indexed (ex.: e-mail único em usuarios, alertaId em comentarios).
# Desde o Spring Boot 3 essa criação automática vem desligada.
spring.data.mongodb.auto-index-creation=true
